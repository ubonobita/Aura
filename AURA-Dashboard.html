<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURA — Discord Security Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:#05070c;color:#eef3ff}
body{overflow-x:hidden}button,input{font:inherit}button{cursor:pointer;color:inherit}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:
radial-gradient(circle at 72% 8%,rgba(42,108,255,.16),transparent 30%),
radial-gradient(circle at 12% 80%,rgba(100,63,255,.11),transparent 28%)}
.bg-grid{position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 90%)}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.22;pointer-events:none;animation:float 12s ease-in-out infinite}.b1{width:260px;height:260px;background:#246bff;right:-80px;top:20%}.b2{width:220px;height:220px;background:#713dff;left:-100px;bottom:5%;animation-delay:-5s}
@keyframes float{50%{transform:translate(25px,-30px) scale(1.08)}}
.layout{display:flex;min-height:100vh}.side{width:250px;position:fixed;z-index:20;inset:0 auto 0 0;padding:20px 14px;background:rgba(6,9,16,.82);border-right:1px solid rgba(255,255,255,.07);backdrop-filter:blur(24px);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:5px 8px 25px}.brand img{width:43px;height:43px;object-fit:contain;filter:drop-shadow(0 0 15px rgba(55,128,255,.35))}.brand b{display:block;font:700 20px 'Space Grotesk';letter-spacing:.05em}.brand small{display:block;color:#667087;font-size:8px;letter-spacing:.18em;margin-top:2px}
.label{font-size:8px;letter-spacing:.18em;color:#515c72;padding:12px 10px 8px}.nav{width:100%;border:1px solid transparent;background:transparent;border-radius:11px;padding:11px 12px;display:flex;align-items:center;gap:11px;color:#7d879b;font-size:11px;margin:2px 0;transition:.2s}.nav:hover{background:rgba(255,255,255,.035);color:#e7edfb;transform:translateX(2px)}.nav.active{background:linear-gradient(90deg,rgba(67,123,255,.17),rgba(118,76,255,.07));border-color:rgba(85,135,255,.18);color:#eaf1ff;box-shadow:inset 2px 0 #5b8fff}.nav .chev{margin-left:auto}.dot{width:6px;height:6px;border-radius:50%;background:#51e79a;box-shadow:0 0 10px #51e79a;margin-left:auto}
.dev-mini{margin-top:auto;padding:11px;border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(255,255,255,.025);display:flex;align-items:center;gap:9px}.dev-mini img{width:35px;height:35px;border-radius:10px;object-fit:cover;filter:grayscale(100%)}.dev-mini b,.dev-mini small{display:block}.dev-mini b{font-size:10px}.dev-mini small{font-size:8px;color:#697388;margin-top:2px}
.main{margin-left:250px;width:calc(100% - 250px);position:relative}.top{height:67px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:15;background:rgba(5,7,12,.72);backdrop-filter:blur(20px)}.crumb{font-size:10px;color:#667187}.crumb b{color:#dce5f8}.top-right{display:flex;align-items:center;gap:9px}.icon{width:35px;height:35px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);border-radius:10px;display:grid;place-items:center}.profile{display:flex;align-items:center;gap:8px;background:transparent;border:0}.profile img{width:33px;height:33px;border-radius:10px;object-fit:cover}.profile b,.profile small{display:block;text-align:left}.profile b{font-size:10px}.profile small{font-size:8px;color:#687287;margin-top:2px}
.content{max-width:1450px;margin:auto;padding:34px 34px 10px}.hero{min-height:300px;border:1px solid rgba(255,255,255,.07);border-radius:24px;padding:40px;position:relative;overflow:hidden;background:linear-gradient(120deg,rgba(12,18,32,.9),rgba(8,11,20,.64));display:flex;align-items:center;justify-content:space-between;animation:enter .65s both}.hero:after{content:"";position:absolute;width:480px;height:480px;right:-200px;top:-240px;border-radius:50%;border:1px solid rgba(78,132,255,.12);box-shadow:0 0 120px rgba(49,111,255,.12)}@keyframes enter{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.eyebrow{font-size:8px;letter-spacing:.18em;color:#7e8aa3}.live{display:inline-flex;align-items:center;gap:7px;color:#68e7a1}.live i{width:6px;height:6px;border-radius:50%;background:#55e7a0;box-shadow:0 0 12px #55e7a0}.hero h1{font:700 clamp(40px,5vw,67px)/1 'Space Grotesk';letter-spacing:-.055em;margin:14px 0}.grad{background:linear-gradient(90deg,#fff,#6ea7ff 48%,#b38bff);-webkit-background-clip:text;color:transparent}.hero p{max-width:560px;color:#7e899e;font-size:13px;line-height:1.75}.actions{display:flex;gap:9px;margin-top:25px}.primary,.secondary{border-radius:11px;padding:11px 15px;border:1px solid rgba(255,255,255,.08);font-size:10px;font-weight:700;transition:.2s}.primary{background:linear-gradient(135deg,#3e83ff,#7058ff);box-shadow:0 12px 35px rgba(64,105,255,.25)}.secondary{background:rgba(255,255,255,.035);color:#c9d2e5}.primary:hover,.secondary:hover{transform:translateY(-3px)}.orbit{width:240px;height:240px;position:relative;display:grid;place-items:center;margin-right:4%;z-index:1}.ring{position:absolute;border:1px solid rgba(83,140,255,.3);border-radius:50%;inset:0;animation:spin 18s linear infinite}.ring.r2{inset:25px;border-style:dashed;border-color:rgba(163,102,255,.3);animation-duration:12s;animation-direction:reverse}.ring:before,.ring:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#6da4ff;box-shadow:0 0 15px #6da4ff;top:8%;left:50%}.ring:after{top:auto;left:auto;right:8%;bottom:25%;background:#b18aff;box-shadow:0 0 15px #b18aff}@keyframes spin{to{transform:rotate(360deg)}}.core{width:105px;height:105px;border-radius:30px;border:1px solid rgba(103,157,255,.38);background:radial-gradient(circle at 50% 40%,#16264a,#070a11 70%);display:grid;place-items:center;box-shadow:0 0 65px rgba(54,121,255,.28),inset 0 0 35px rgba(107,79,255,.12);animation:pulse 3s ease-in-out infinite}.core img{width:75px;height:75px;object-fit:contain}@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 90px rgba(54,121,255,.38),inset 0 0 35px rgba(107,79,255,.18)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 42px}.card{border:1px solid rgba(255,255,255,.07);background:rgba(11,15,24,.67);backdrop-filter:blur(16px);border-radius:16px}.stat{padding:17px;display:flex;gap:12px;align-items:center;transition:.25s}.stat:hover{transform:translateY(-5px);border-color:rgba(91,143,255,.25);box-shadow:0 15px 45px rgba(0,0,0,.18)}.sicon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:rgba(73,130,255,.09);font-size:18px}.muted{font-size:9px;color:#69748a}.stat strong{display:inline-block;font:700 22px 'Space Grotesk';margin:4px 7px 0 0}.note{font-size:8px;color:#657087}
.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.head h2{font:700 23px 'Space Grotesk';margin:5px 0 0}.servers{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:14px}.server{padding:14px;display:flex;align-items:center;gap:11px;text-align:left;width:100%;transition:.2s}.server:hover,.server.sel{transform:translateY(-4px);border-color:rgba(91,143,255,.3);box-shadow:0 18px 45px rgba(0,0,0,.18)}.avatar{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;font:700 16px 'Space Grotesk';background:linear-gradient(135deg,#183b70,#131827);border:1px solid rgba(255,255,255,.07)}.server b,.server small{display:block}.server b{font-size:11px}.server small{font-size:8px;color:#68748a;margin-top:4px}.health{margin-left:auto;font-size:8px;color:#62e49b}.health i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#58e69d;box-shadow:0 0 8px #58e69d;margin-right:4px}
.grid2{display:grid;grid-template-columns:1.5fr .8fr;gap:13px}.panel{padding:20px}.panel h3{font:600 16px 'Space Grotesk';margin:5px 0}.pill{font-size:7px;letter-spacing:.13em;color:#5fe29a;border:1px solid rgba(95,226,154,.18);padding:5px 7px;border-radius:6px}.chart{height:225px;margin-top:8px;position:relative}.chart-lines{position:absolute;inset:15px 0 28px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 45px,rgba(255,255,255,.045) 46px)}svg{width:100%;height:190px;position:absolute;top:8px}.line{fill:none;stroke:#6a9fff;stroke-width:3;filter:drop-shadow(0 0 6px rgba(80,140,255,.35))}.area{fill:url(#g)}.labels{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;color:#515d72;font-size:8px}.chartfoot{border-top:1px solid rgba(255,255,255,.06);padding-top:12px;display:flex;gap:9px;color:#68748a;font-size:8px}.chartfoot b{margin-left:auto;color:#edf2ff;font-size:12px}.up{color:#5dde98}
.toggle{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.055);display:flex;align-items:center;justify-content:space-between}.toggle b,.toggle small{display:block}.toggle b{font-size:10px}.toggle small{font-size:8px;color:#667287;margin-top:3px}.switch{width:37px;height:21px;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:#1a202d;padding:3px}.switch span{display:block;width:13px;height:13px;border-radius:50%;background:#697388;transition:.2s}.switch.on{background:#356bd7}.switch.on span{transform:translateX(15px);background:#fff}.save{width:100%;margin-top:13px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035);font-size:9px}
.developer{margin-top:13px;padding:20px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}.devpic{width:78px;height:78px;border-radius:22px;object-fit:cover;filter:grayscale(100%);border:1px solid rgba(255,255,255,.08)}.developer h2{font:700 22px 'Space Grotesk';margin:5px 0}.developer p{font-size:9px;line-height:1.7;color:#758096;max-width:720px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tags span{font-size:8px;color:#8993a7;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.035)}.bigN{position:absolute;right:35px;font:800 95px 'Space Grotesk';color:rgba(255,255,255,.025)}
.page{animation:enter .45s both}.pagehead{padding:15px 0 24px}.pagehead h1{font:700 39px 'Space Grotesk';margin:7px 0}.pagehead p{font-size:11px;color:#778298}.toolbar{display:flex;gap:9px;margin-bottom:13px}.search{flex:1;max-width:650px;height:41px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);border-radius:11px;display:flex;align-items:center;padding:0 12px;color:#68748a}.search input{width:100%;background:none;border:0;outline:0;color:#fff;font-size:10px}.cmdgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.cmdgroup{overflow:hidden}.cmdhead{padding:15px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;gap:10px;align-items:center}.cmdico{width:35px;height:35px;border-radius:10px;background:rgba(72,129,255,.08);display:grid;place-items:center}.cmdhead b,.cmdhead small{display:block}.cmdhead b{font-size:11px}.cmdhead small{font-size:8px;color:#68748a;margin-top:3px}.cmd{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.045);padding:11px 15px;display:flex;justify-content:space-between;color:#8993a7;font-size:9px}.cmd:hover{background:rgba(255,255,255,.035);color:#eef3ff}.details{padding:11px 15px;background:rgba(68,127,255,.045);border-bottom:1px solid rgba(255,255,255,.06)}.details code{font-size:9px;color:#77a6ff}.details p{font-size:8px;color:#68748a}.notice{padding:13px;border:1px solid rgba(255,200,90,.12);background:rgba(255,200,90,.035);border-radius:11px;color:#9a8a69;font-size:9px;line-height:1.6}.settings{display:grid;grid-template-columns:1fr 1fr;gap:13px}.settingrow{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.055);display:flex;justify-content:space-between;align-items:center}.settingrow b{font-size:10px}.settingrow small{display:block;color:#68748a;font-size:8px;margin-top:3px}
footer{display:flex;justify-content:space-between;color:#3f485b;font-size:8px;padding:25px 2px 10px}.mobile{display:none}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.servers,.grid2,.settings{grid-template-columns:1fr}.orbit{width:180px;height:180px}.cmdgrid{grid-template-columns:1fr}}
@media(max-width:760px){.side{transform:translateX(-100%);transition:.3s;width:260px;box-shadow:20px 0 60px #000}.side.open{transform:none}.main{margin-left:0;width:100%}.mobile{display:grid}.top{padding:0 15px}.content{padding:22px 14px}.hero{padding:27px 21px}.hero h1{font-size:41px}.orbit{display:none}.actions{flex-direction:column}.actions button{width:100%}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:18px}.note{display:none}.developer{align-items:flex-start}.devpic{width:62px;height:62px;border-radius:17px}.bigN{display:none}footer{flex-direction:column;gap:6px}.profile span{display:none}.profile svg{display:none}.cmdgrid{grid-template-columns:1fr}.toolbar{flex-direction:column}.search{max-width:none}}
</style>

function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

if(current==='Settings') return `<div class="page"><div class="pagehead"><div class="eyebrow">SYSTEM</div><h1>Settings</h1><p>Dashboard preferences and secure connection status.</p></div><div class="settings"><section class="card panel"><div class="eyebrow">CONNECTION</div><h3>Discord Integration</h3><div class="settingrow"><div><b>Bot connection</b><small>Dashboard API is ready to connect</small></div><span class="pill">ONLINE</span></div><div class="settingrow"><div><b>Developer</b><small>Nobita</small></div><span>✓</span></div><div class="notice">🔐 Never place your Discord bot token inside this HTML file or any client-side JavaScript.</div></section><section class="card panel"><div class="eyebrow">PREFERENCES</div><h3>Interface</h3>${toggle('Animations','Smooth dashboard motion',true)}${toggle('Glass effects','Blurred premium panels',true)}${toggle('Notifications','Show dashboard alerts',true)}</section></div></div>`;
let list=commands[current]||commands.Commands;
return `<div class="page"><div class="pagehead"><div class="eyebrow">CONTROL CENTER</div><h1>${current}</h1><p>Manage AURA features and explore available commands.</p></div><div class="toolbar"><div class="search">⌕ <input id="search" placeholder="Search commands..." oninput="filterCmd(this.value)"></div></div><div id="cmdgrid" class="cmdgrid">${cmdgroup(current,list)}</div></div>`;
}
function cmdgroup(name,list){return `<section class="card cmdgroup"><div class="cmdhead"><div class="cmdico">${({Security:'🛡',Automod:'◉',Verification:'🔒',Moderation:'⚔',Commands:'⌘'})[name]||'✦'}</div><div><b>${name}</b><small>${list.length} commands available</small></div></div>${list.map(c=>`<button class="cmd" onclick="this.nextElementSibling.classList.toggle('details')"><span>/${c}</span><span>›</span></button><div class="details" style="display:none"><code>/${c}</code><p>AURA ${name.toLowerCase()} command. Configure and use it from your Discord server.</p></div>`).join('')}</section>`}
function filterCmd(q){q=q.toLowerCase();let list=(commands[current]||commands.Commands).filter(x=>x.toLowerCase().includes(q));document.getElementById('cmdgrid').innerHTML=cmdgroup(current,list)}
function render(){document.getElementById('app').innerHTML=current==='Overview'?overview():section();document.getElementById('app').insertAdjacentHTML('beforeend',`<footer><span>© 2026 AURA</span><span>Built with precision by <b>Nobita</b></span><span>v1.0.0 • Online</span></footer>`)}
function toggleSide(){document.getElementById('side').classList.toggle('open')}
function showToast(){let t=document.getElementById('toast');t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2200)}
renderNav();render();
</script>
</body>
</html>
